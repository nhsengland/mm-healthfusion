seed: 42
outcome: deterioration_mechanical_ventilation

data:
  batch_size: 32
  num_workers: 3
  pin_memory: false
  shuffle_train: true
  split_dir: ../outputs/deterioration/3.1_ohe/deterioration_allStay_averageRecord_allCohort/deterioration_allStay_averageRecord_allCohort_normalised_ohe
  modalities: [tabular, ecg, cxr]

model:
  name: m3care
  collate_style: m3care
  d_model: 128
  modality_names: [tabular, ecg, cxr]
  dropout: 0.1
  output_dim: 1
  MHD_num_head: 4
  use_modality_mask: true
  impute: true
  missingness_embedding: false
  graph_construction_loss_weight: 0.01
  stability_loss_type: norm
  gcn_refine_mode: adaptive
  mask_missingness_fusion: true
  # modalities_to_impute: [cxr]

train:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping: 10
  modality_dropout:
    enabled: false
    ecg_prob: 0.1
    cxr_prob: 0.5

evaluation:
  modality_ablation:
    enabled: true
