seed: 42
outcome: deterioration_mechanical_ventilation

data:
  batch_size: 32
  num_workers: 3
  pin_memory: false
  shuffle_train: true
  split_dir: ../outputs/deterioration/3.1_ohe/deterioration_allStay_averageRecord_allCohort/deterioration_allStay_averageRecord_allCohort_normalised_ohe
  modalities: [tabular, ecg, cxr]

model:
  name: smp
  fusion_method: smp
  collate_style: fusemoe
  modality_names: [tabular, ecg, cxr]

  d_model: 128
  dropout: 0
  output_dim: 1

  gating: softmax  # softmax | laplace | gaussian
  moe_hidden_size: 256
  top_k: 2
  disjoint_top_k: 1  # Experts each disjoint router picks, at most num_experts // number of modalities
  use_modality_mask: true  # Zero missing modality inputs before routing

  # The shared expert processes every row alongside the routed experts
  use_shared_expert: true
  shared_expert_weight: 0.333  # Probability mixture weight for log_prob

  # Cosine scores use a learned scale and require softmax gating
  router_score: cosine  # dot | cosine

  router_type: joint  # joint | permod | disjoint | combination
  num_experts: 7

  loss_coef: 0.01  # Weight of the load-balancing loss

  # These settings apply only to combination routing
  # Combination experts follow largest groups first, then any extra experts
  combination_router_supervision: true  # Favour the expert for the available modalities
  combination_router_loss_weight: 0.1  # Weight of the combination supervision loss
  combination_supervise_full_modality: true  # Include rows with all modalities

  # When enabled, balance complete and incomplete rows separately
  # Incomplete rows exclude expert 0, which represents all modalities
  combination_balance_exclusion: false

train:
  epochs: 50
  learning_rate: 5.0e-5
  weight_decay: 1.0e-3
  early_stopping: 10

  # Drop modalities only during training when enabled
  modality_dropout:
    enabled: false
    ecg_prob: 0.05
    cxr_prob: 0.05

evaluation:
  modality_ablation:
    enabled: true
