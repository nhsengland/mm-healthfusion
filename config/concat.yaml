seed: 42
outcome: deterioration_mechanical_ventilation

data:
  batch_size: 32
  num_workers: 3
  pin_memory: false
  shuffle_train: true
  split_dir: ../outputs/deterioration/2.2/deterioration_allStay_averageRecord_allCohort/deterioration_allStay_averageRecord_allCohort_normalised_ohe
  modalities: [tabular, ecg, cxr]

model:
  name: concat
  collate_style: concat
  modality_names: [tabular, ecg, cxr]
  d_model: 128
  dropout: 0
  output_dim: 1

train:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping: 10
  modality_dropout:
    enabled: false
    ecg_prob: 0
    cxr_prob: 0

evaluation:
  modality_ablation:
    enabled: true
