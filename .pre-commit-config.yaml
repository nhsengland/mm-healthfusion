# Keep uv.lock in sync with pyproject.toml, and regenerate requirements.txt from uv.lock
repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.13.7  # match the uv version in environment.yml
  hooks:
    - id: uv-lock
    - id: uv-export
      # Keep these args identical to .github/workflows/check_lock.yml
      args: ["--frozen", "--no-hashes", "--all-groups", "--emit-index-url", "--output-file=requirements.txt", "--quiet"]

# Run ruff:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.5.0
  hooks:
    # Run the linter.
    - id: ruff
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format # replaces Black

# Add pre-commit-hooks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
